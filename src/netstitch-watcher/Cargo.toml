[package]
name = "netstitch-watcher"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
rcgen.workspace = true
rustls.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

netstitch-core = { path = "../netstitch-core" }
netstitch-cloud = { path = "../netstitch-cloud" }
netstitch-connectors = { path = "../netstitch-connectors" }
netstitch-shared = { path = "../netstitch-shared" }
netstitch-tool = { path = "../netstitch-tool" }

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
