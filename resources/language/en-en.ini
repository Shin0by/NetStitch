dialog.info.about_footer = Identifier: not created
dialog.info.info_footer = This application is used to analyze application network activity with import and export of collected data.
dialog.info.group_monitoring = Monitoring
dialog.info.monitoring_1 = Monitoring is enabled only for applications selected by the user.
dialog.info.monitoring_2 = NetStitch reads local Windows connection tables and stores IP, port, protocol, connection state, first/last seen time, and repeat count.
dialog.info.monitoring_3 = Traffic content is not stored.
dialog.info.monitoring_4 = Monitoring rows stay in the local SQLite database inside the portable folder.
dialog.info.monitoring_5 = Basic monitoring reads TCP from system tables every 1 second; Advanced monitoring additionally captures UDP/QUIC sockets and verified domains through WinDivert when running elevated.
dialog.info.group_domains = Advanced monitoring
dialog.info.domains_1 = Advanced monitoring adds UDP/QUIC endpoints and stores a domain only when verified from HTTP Host, TCP TLS ClientHello SNI, or QUIC Initial SNI on UDP/443.
dialog.info.domains_2 = If a domain cannot be tied unambiguously to an observation of the selected app, the field stays empty.
dialog.info.domains_4 = UDP/QUIC sockets and verified domains require WinDivert, and Windows allows network sniff/FLOW access only for an elevated process.
dialog.info.group_csv = CSV import and export
dialog.info.csv_1 = CSV import can bring monitoring data from another source and append it to the current monitoring list.
dialog.info.csv_2 = CSV export saves selected monitoring rows to a file with the same columns shown in the table.
dialog.info.group_cloud_sync = Cloud
dialog.info.cloud_sync_1 = Cloud requests run only after an explicit user action in the Cloud window.
dialog.info.cloud_sync_2 = Sign-in uses Google OAuth; NetStitch does not accept or store a user password.
dialog.info.cloud_sync_3 = The local session token, signing key, and display-only Google name/email are stored only as Windows DPAPI-protected blobs until explicit sign-out; the Google access token is not written locally.
dialog.info.group_web_access = Web access
dialog.info.web_access_1 = The browser interface address is copied by clicking the Web server indicator in the main window footer.
dialog.info.web_access_2 = The copied link contains the access key after #; the browser sends that key to the local server with a POST request and then hides it from the address bar.
dialog.info.web_access_3 = If only the IP and port are opened without the key, the key prompt is shown. HTTPS uses a local self-signed certificate from portable storage, so the browser may show a trust warning.
dialog.info.group_modules = Modules
dialog.info.modules_1 = External modules are installed and used at your own risk.
dialog.info.modules_2 = Native modules run with the NetStitch process privileges and may access files, network, registry, and other host resources like a full application.
dialog.info.modules_3 = Install only modules from trusted sources and remember that NetStitch does not sandbox their system capabilities.
dialog.info.group_tracked_apps = Tracked apps
dialog.info.tracked_apps_1 = Tracked apps define which processes participate in monitoring.
dialog.info.group_ignored_addresses = Ignored addresses
dialog.info.ignored_addresses_1 = Ignored addresses hide localhost and local machine addresses so service traffic does not pollute the table.
dialog.info.ignored_addresses_2 = You can also add other addresses that should be excluded from display and export.
dialog.info.close = Close
dialog.domain_capture_admin.title = Administrator rights required
dialog.domain_capture_admin.help = Advanced monitoring uses WinDivert FLOW/NETWORK sniffing and cannot be enabled unless NetStitch is started as administrator.
dialog.domain_capture_admin.close = Got it
