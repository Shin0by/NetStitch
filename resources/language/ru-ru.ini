dialog.info.about_footer = Идентификатор: не создан
dialog.info.info_footer = Данное приложение служит для анализа сетевой активности приложений с возможностью импорта и экспорта полученных данных.
dialog.info.group_monitoring = Мониторинг
dialog.info.monitoring_1 = Мониторинг включается только для выбранных пользователем приложений.
dialog.info.monitoring_2 = NetStitch читает локальные таблицы соединений Windows и сохраняет IP, порт, протокол, состояние соединения, время первого и последнего появления и число повторов.
dialog.info.monitoring_3 = Содержимое трафика не сохраняется.
dialog.info.monitoring_4 = Строки мониторинга остаются в локальной SQLite-базе portable-папки.
dialog.info.monitoring_5 = Обычный мониторинг читает TCP из системных таблиц раз в 1 секунду; режим «Расшир. монитор.» дополнительно подхватывает UDP/QUIC-сокеты и доказанные домены через WinDivert при правах администратора.
dialog.info.group_domains = Расширенный мониторинг
dialog.info.domains_1 = Режим «Расшир. монитор.» добавляет UDP/QUIC endpoint-ы и записывает домен только если он доказан из HTTP Host, TCP TLS ClientHello SNI или QUIC Initial SNI на UDP/443.
dialog.info.domains_2 = Если домен нельзя однозначно связать с наблюдением выбранного приложения, поле остаётся пустым.
dialog.info.domains_4 = UDP/QUIC-сокеты и доказанные домены требуют WinDivert, которому Windows разрешает сетевой sniff/FLOW-доступ только для повышенного процесса.
dialog.info.group_csv = Импорт и экспорт CSV
dialog.info.csv_1 = Импорт CSV позволяет получить данные мониторинга из другого источника и дополнить ими текущий список мониторинга.
dialog.info.csv_2 = Экспорт CSV сохраняет выбранные строки мониторинга в файл с теми же столбцами, что показаны в таблице.
dialog.info.group_cloud_sync = Облако
dialog.info.cloud_sync_1 = Облачные запросы выполняются только после явного действия пользователя в окне «Облако».
dialog.info.cloud_sync_2 = Для входа используется Google OAuth; пользовательский пароль NetStitch не принимает и не хранит.
dialog.info.cloud_sync_3 = Токен локальной сессии, ключ подписи и отображаемые имя/почта Google сохраняются только как Windows DPAPI-защищённые blobs до явного выхода; Google access token локально не записывается.
dialog.info.group_web_access = Веб-доступ
dialog.info.web_access_1 = Адрес веб-интерфейса копируется кликом по индикатору «Веб-сервер» в футере главного окна.
dialog.info.web_access_2 = Скопированная ссылка содержит ключ доступа после символа #; браузер отправляет этот ключ локальному серверу POST-запросом и затем скрывает его из адресной строки.
dialog.info.web_access_3 = Если открыть только IP и порт без ключа, появится окно ввода ключа. HTTPS использует локальный самоподписанный сертификат из portable storage, поэтому браузер может показать предупреждение доверия.
dialog.info.group_modules = Модули
dialog.info.modules_1 = Внешние модули устанавливаются и используются на ваш риск.
dialog.info.modules_2 = Native-модули запускаются с правами процесса NetStitch и могут получить доступ к файлам, сети, реестру и другим ресурсам хоста как полноценное приложение.
dialog.info.modules_3 = Устанавливайте только модули из доверенных источников и учитывайте, что NetStitch не ограничивает их системные возможности.
dialog.info.group_tracked_apps = Отслеживаемые приложения
dialog.info.tracked_apps_1 = Отслеживаемые приложения задают, какие процессы участвуют в мониторинге.
dialog.info.group_ignored_addresses = Игнорируемые адреса
dialog.info.ignored_addresses_1 = Игнорируемые адреса скрывают localhost и локальные адреса машины, чтобы не засорять таблицу служебным трафиком.
dialog.info.ignored_addresses_2 = В этот список можно добавить и другие адреса, которые нужно исключить из отображения и экспорта.
dialog.info.close = Закрыть
dialog.domain_capture_admin.title = Нужны права администратора
dialog.domain_capture_admin.help = Расширенный мониторинг использует WinDivert FLOW/NETWORK sniff и не может включиться без запуска NetStitch от имени администратора.
dialog.domain_capture_admin.close = Понятно
